Updated properties file for Spring Boot 3.x compatibility:

# logging
logging.level.root=INFO
logging.level.org.springframework=DEBUG
logging.file=/tmp/logs/app.log

# management
management.server.port=8082
management.endpoint.health.show-details=always
management.endpoint.info.show-details=always
management.endpoint.metrics.show-details=always
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.shutdown.enabled=true

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=%h %t "%r" %s %b

spring.jackson.serialization.write_dates_as_timestamps=false

management.httptrace.include=REQUEST_HEADERS,RESPONSE_HEADERS,PRINCIPAL,REMOTE_ADDRESS,SESSION_ID

spring.datasource.url=jdbc:mysql://localhost:3306/mydb?useSSL=false&serverTimezone=GMT
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
spring.jpa.properties.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.application.name=spring-boot-project

spring.profiles.active=prod

server.port=8080

management.health.db.password=mysecret

# god
# god.url=http://localhost:8080
# god.monitor.excludedRoutes=/health, /info, /metrics
