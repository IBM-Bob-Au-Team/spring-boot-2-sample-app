spring.cloud.stream.kafka.streams.binder.configuration.metrics.reporter.topic=stream-metrics
spring.cloud.stream.kafka.streams.binder.configuration.metrics.reporter.value.serializer=io.confluent.metrics.serializers.MetricReportEntityEncoder
spring.cloud.stream.kafka.streams.binder.configuration.producer.interceptor.classes=io.confluent.metrics.reporter.KafkaMetricsReporterInterceptor
