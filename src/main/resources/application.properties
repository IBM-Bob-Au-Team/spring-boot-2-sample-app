# god.monitor.excludedRoutes=/monitor.html


Note: Spring Boot 3.x does not use application.properties anymore. Instead, it uses configuration properties in the form of application-${profile}.properties files or in the application.yml/application.yaml file. The changes provided are for updating the properties within the application.properties file itself. For a production environment, consider moving to application.yml/application.yaml and using environment variables for sensitive information like passwords.