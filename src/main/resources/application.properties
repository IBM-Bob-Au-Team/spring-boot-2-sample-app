
spring.application.name=dessert-chef
spring.main.allow-beam-shutdown=false
spring.telefono.delay=5000
spring.telefono.retries=5

spring.profiling.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/database_name
spring.datasource.username=username
spring.datasource.password=password
spring.jpa.hibernate.naming-strategy=org.springframework.boot.orm.jpa.hibernate.SpringNamingStrategy
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
spring.jpa.properties.hibernate.test-while-idle=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
